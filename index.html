<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>idk Plus Store</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --accent: #2563eb;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 90px; -webkit-font-smoothing: antialiased; }

        .banner-wrapper { padding: 12px 15px; }
        .banner { background: linear-gradient(135deg, #1d4ed8, #4f46e5); border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 8px 20px rgba(29, 78, 216, 0.3); }
        .banner h3 { margin: 0 0 4px 0; font-size: 18px; font-weight: 800; }
        .banner p { margin: 0; font-size: 12px; opacity: 0.85; }

        .search-area { padding: 0 15px; margin-bottom: 12px; }
        .search-box { display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 4px 6px 4px 14px; }
        .search-input { flex: 1; background: transparent; border: none; color: #fff; font-size: 13.5px; outline: none; padding: 8px 0; }
        .search-btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        .categories { display: flex; gap: 8px; overflow-x: auto; padding: 0 15px 12px 15px; scrollbar-width: none; }
        .chip { background: var(--card-bg); border: 1px solid var(--border); padding: 7px 16px; border-radius: 20px; font-size: 12.5px; color: var(--text-sub); cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chip.active { background: var(--accent); color: #fff; font-weight: bold; border-color: var(--accent); }

        .section-header { padding: 0 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .section-title { font-size: 15px; font-weight: 800; }
        .count-badge { background: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: bold; }

        .apps-list { padding: 0 15px; display: flex; flex-direction: column; gap: 9px; }
        
        .app-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; }
        .app-main { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; min-width: 0; padding-left: 8px; }
        .app-icon { width: 50px; height: 50px; border-radius: 11px; background: #1e293b; object-fit: cover; flex-shrink: 0; }
        .app-info { display: flex; flex-direction: column; min-width: 0; }
        .app-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .app-note { font-size: 11px; color: #38bdf8; margin-top: 3px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-get { background: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 7px 16px; border-radius: 18px; font-weight: bold; font-size: 12.5px; text-decoration: none; flex-shrink: 0; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-top-left-radius: 20px; border-top-right-radius: 20px; width: 100%; padding: 22px; border-top: 1px solid var(--border); max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { background: #1e293b; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; position: absolute; left: 15px; top: 15px; font-weight: bold; cursor: pointer; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(19, 27, 46, 0.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px 0; z-index: 90; }
        .nav-item { color: var(--text-sub); text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 25%; }
        .nav-item.active { color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body>

    <div class="banner-wrapper">
        <div class="banner">
            <h3>متجر idk Plus</h3>
            <p>سورس للتطبيقات والألعاب المعدلة</p>
        </div>
    </div>

    <div class="search-area">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن تطبيق، لعبة، أو أداة..." onkeyup="if(event.key==='Enter') executeSearch()">
            <button class="search-btn" onclick="executeSearch()">🔍 بحث</button>
        </div>
    </div>

    <div class="categories">
        <div class="chip active" id="chip-all" onclick="filterCategory('all')">الكل</div>
        <div class="chip" id="chip-games" onclick="filterCategory('games')">🎮 الألعاب</div>
        <div class="chip" id="chip-plus" onclick="filterCategory('plus')">⭐ تطبيقات بلس</div>
        <div class="chip" id="chip-tools" onclick="filterCategory('tools')">⚙️ الأدوات والجيلبريك</div>
    </div>

    <div class="section-header">
        <div class="section-title" id="sectionTitle">التطبيقات المتاحة</div>
        <div class="count-badge" id="countBadge">0 عنصر</div>
    </div>

    <div id="appsContainer" class="apps-list">
        <div style="text-align:center; color:var(--text-sub); padding:30px;">جاري تحميل البيانات...</div>
    </div>

    <div id="appModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="navHome" onclick="filterCategory('all')">
            <span style="font-size:16px;">📱</span> الرئيسية
        </div>
        <div class="nav-item" id="navGames" onclick="filterCategory('games')">
            <span style="font-size:16px;">🎮</span> الألعاب
        </div>
        <div class="nav-item" id="navPlus" onclick="filterCategory('plus')">
            <span style="font-size:16px;">⭐</span> البلس
        </div>
        <div class="nav-item" id="navTools" onclick="filterCategory('tools')">
            <span style="font-size:16px;">⚙️</span> الأدوات
        </div>
    </nav>

    <script>
        let rawData = [];
        let currentFilter = 'all';

        const GAME_KEYWORDS = ['game', 'hack', 'pubg', '8ball', 'pool', 'clash', 'royale', 'duty', 'cod', 'gta', 'free fire', 'subway', 'car', 'ball', 'لعبة', 'العاب'];
        const TOOL_KEYWORDS = ['jailbreak', 'root', 'boost', 'booster', 'gearup', 'tool', 'tweak', 'filza', 'uncover', 'dopamine', 'trollstore', 'أداة', 'جيلبريك'];

        // جلب البيانات من jom 2.json بشكل مباشر وآمن
        fetch(encodeURIComponent('jom 2.json'))
            .then(res => {
                if (!res.ok) throw new Error('Network error');
                return res.json();
            })
            .then(data => {
                rawData = Array.isArray(data) ? data : (data.apps || data.items || []);
                filterCategory('all');
            })
            .catch(() => {
                // تجربة جلب اسم الملف البديل في حال تم تغييره مستقبلاً
                fetch('IPA-AR.json')
                    .then(r => r.json())
                    .then(data => {
                        rawData = Array.isArray(data) ? data : (data.apps || data.items || []);
                        filterCategory('all');
                    })
                    .catch(() => {
                        document.getElementById('appsContainer').innerHTML = '<div style="text-align:center; color:#ef4444; padding:20px;">خطأ في تحميل ملف JSON</div>';
                    });
            });

        function isGame(app) {
            const str = ((app.name || '') + ' ' + (app.subtitle || '') + ' ' + (app.category || '')).toLowerCase();
            if (str.includes('videostar') || str.includes('alight motion')) return false;
            return GAME_KEYWORDS.some(k => str.includes(k));
        }

        function isTool(app) {
            const str = ((app.name || '') + ' ' + (app.subtitle || '') + ' ' + (app.category || '')).toLowerCase();
            return TOOL_KEYWORDS.some(k => str.includes(k));
        }

        function filterCategory(type) {
            currentFilter = type;
            document.getElementById('searchInput').value = '';

            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            const activeChip = document.getElementById(`chip-${type}`);
            if (activeChip) activeChip.classList.add('active');

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const navMap = { 'all': 'navHome', 'games': 'navGames', 'plus': 'navPlus', 'tools': 'navTools' };
            if (navMap[type]) document.getElementById(navMap[type]).classList.add('active');

            const titleEl = document.getElementById('sectionTitle');
            let filtered = [];

            if (type === 'games') {
                titleEl.innerText = 'قسم الألعاب';
                filtered = rawData.filter(app => isGame(app));
            } else if (type === 'tools') {
                titleEl.innerText = 'الأدوات والجيلبريك';
                filtered = rawData.filter(app => isTool(app));
            } else if (type === 'plus') {
                titleEl.innerText = 'تطبيقات البلس والشبكات';
                filtered = rawData.filter(app => !isGame(app) && !isTool(app));
            } else {
                titleEl.innerText = 'التطبيقات المتاحة';
                filtered = rawData;
            }

            renderStore(filtered);
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const titleEl = document.getElementById('sectionTitle');

            if (!query) {
                filterCategory(currentFilter);
                return;
            }

            titleEl.innerText = `نتائج البحث عن: "${query}"`;
            
            const filtered = rawData.filter(app => {
                const name = (app.name || app.title || '').toLowerCase();
                const note = (app.subtitle || app.caption || app.description || app.note || '').toLowerCase();
                return name.includes(query) || note.includes(query);
            });

            renderStore(filtered);
        }

        function renderStore(list) {
            const container = document.getElementById('appsContainer');
            const countBadge = document.getElementById('countBadge');
            
            container.innerHTML = '';
            countBadge.innerText = `${list.length} ${currentFilter === 'games' ? 'لعبة' : 'عنصر'}`;

            if (!list || !list.length) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:30px;">لا توجد نتائج مطابقة</div>';
                return;
            }

            const fragment = document.createDocumentFragment();

            list.forEach(app => {
                const name = app.name || app.title || 'تطبيق';
                const icon = app.iconURL || app.icon || app.icon_url || '';
                const version = app.version || app.ver || '1.0';
                const url = app.downloadURL || app.get || app.url || app.link || '';
                const note = app.subtitle || app.caption || app.description || app.note || '';

                if (!url) return;

                const installLink = url.startsWith('itms-services') ? url : `itms-services://?action=download-manifest&url=${url}`;

                const item = document.createElement('div');
                item.className = 'app-item';
                item.innerHTML = `
                    <div class="app-main">
                        <img class="app-icon" src="${icon}" onerror="this.src='https://via.placeholder.com/50/1e293b/ffffff?text=App'">
                        <div class="app-info">
                            <div class="app-title">${name}</div>
                            <div class="app-sub">إصدار ${version}</div>
                            ${note ? `<div class="app-note">💡 ${note}</div>` : ''}
                        </div>
                    </div>
                    <a class="btn-get" href="${installLink}">تثبيت</a>
                `;

                item.querySelector('.app-main').onclick = () => openDetails(app, installLink);
                fragment.appendChild(item);
            });

            container.appendChild(fragment);
        }

        function openDetails(app, installLink) {
            const note = app.subtitle || app.caption || app.description || app.note || 'لا توجد ملاحظات إضافية لهذا التطبيق.';

            document.getElementById('modalBody').innerHTML = `
                <div style="display:flex; gap:12px; align-items:center; margin-bottom:14px;">
                    <img src="${app.iconURL || app.icon || ''}" style="width:60px; height:60px; border-radius:12px;" onerror="this.src='https://via.placeholder.com/60/1e293b/ffffff?text=App'">
                    <div>
                        <h3 style="margin:0; font-size:16px;">${app.name || app.title}</h3>
                        <span style="color:var(--text-sub); font-size:12px;">الإصدار: ${app.version || '1.0'}</span>
                    </div>
                </div>
                <div style="background:rgba(255,255,255,0.04); padding:12px; border-radius:10px; font-size:12.5px; color:#cbd5e1; line-height:1.6; margin-bottom:18px; border:1px solid var(--border);">
                    <strong style="color:#60a5fa; display:block; margin-bottom:4px;">الوصف والملاحظات:</strong>
                    ${note}
                </div>
                <a class="btn-get" style="display:block; text-align:center; padding:11px; font-size:13.5px;" href="${installLink}">تثبيت التطبيق الآن</a>
            `;
            document.getElementById('appModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('appModal').classList.remove('active');
        }
    </script>
</body>
</html>
