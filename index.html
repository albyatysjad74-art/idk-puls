<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>idk Plus Store</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 15px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        #apps-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .app-card:active {
            transform: scale(0.98);
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon {
            width: 54px;
            height: 54px;
            border-radius: 12px;
            object-fit: cover;
            background: #1e293b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .app-details {
            display: flex;
            flex-direction: column;
        }

        .app-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-color);
        }

        .app-version {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 3px;
        }

        .btn-install {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
        }

        .status-msg {
            text-align: center;
            color: var(--text-dim);
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر بلس</h1>
        <input type="text" id="search" class="search-box" placeholder="بحث عن تطبيق..." onkeyup="filterApps()">
    </header>

    <div id="apps-container">
        <div class="status-msg">جاري جلب التطبيقات من السورس...</div>
    </div>

    <script>
        let allApps = [];

        fetch('IPA-AR.json')
            .then(res => res.json())
            .then(data => {
                allApps = Array.isArray(data) ? data : (data.apps || data.items || []);
                renderApps(allApps);
            })
            .catch(err => {
                document.getElementById('apps-container').innerHTML = '<div class="status-msg">فشل تحميل السورس. تأكد من وجود ملف IPA-AR.json</div>';
            });

        function renderApps(apps) {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';

            if (apps.length === 0) {
                container.innerHTML = '<div class="status-msg">لم يتم العثور على نتائج</div>';
                return;
            }

            apps.forEach(app => {
                const name = app.name || app.title || 'تطبيق';
                const icon = app.iconURL || app.icon || app.icon_url || '';
                const url = app.downloadURL || app.get || app.url || app.link || '';
                const version = app.version || app.ver || 'v1.0';

                if (!url) return;

                const installLink = url.startsWith('itms-services') 
                    ? url 
                    : `itms-services://?action=download-manifest&url=${url}`;

                container.innerHTML += `
                    <div class="app-card">
                        <div class="app-info">
                            <img class="app-icon" src="${icon}" onerror="this.src='https://via.placeholder.com/54/1e293b/ffffff?text=App'">
                            <div class="app-details">
                                <span class="app-name">${name}</span>
                                <span class="app-version">${version}</span>
                            </div>
                        </div>
                        <a class="btn-install" href="${installLink}">تثبيت</a>
                    </div>
                `;
            });
        }

        function filterApps() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allApps.filter(app => {
                const name = (app.name || app.title || '').toLowerCase();
                return name.includes(query);
            });
            renderApps(filtered);
        }
    </script>
</body>
</html>
