<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>idk Store</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #131b2e;
            --accent: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 90px; }

        .banner-wrapper { padding: 15px; }
        .banner { background: linear-gradient(135deg, #2563eb, #6366f1); border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25); }
        .banner h3 { margin: 0 0 5px 0; font-size: 18px; }
        .banner p { margin: 0; font-size: 13px; opacity: 0.85; }

        .search-area { padding: 0 15px; margin-bottom: 12px; }
        .search-input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
        
        .categories { display: flex; gap: 8px; overflow-x: auto; padding: 0 15px 15px 15px; scrollbar-width: none; }
        .chip { background: var(--card-bg); border: 1px solid var(--border); padding: 7px 18px; border-radius: 20px; font-size: 13px; white-space: nowrap; color: var(--text-sub); cursor: pointer; }
        .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }

        .section-title { padding: 0 15px; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
        .apps-list { padding: 0 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .app-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; align-items: center; justify-content: space-between; }
        .app-main { display: flex; align-items: center; gap: 12px; cursor: pointer; flex-grow: 1; overflow: hidden; padding-left: 10px; }
        .app-icon { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #1e293b; flex-shrink: 0; }
        .app-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .app-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
        .app-note { font-size: 11px; color: #38bdf8; margin-top: 3px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-get { background: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); padding: 7px 18px; border-radius: 20px; font-weight: bold; font-size: 13px; text-decoration: none; flex-shrink: 0; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; padding: 25px; border-top: 1px solid var(--border); max-height: 80vh; overflow-y: auto; position: relative; }
        .close-btn { background: #1e293b; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; position: absolute; left: 20px; top: 20px; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(19, 27, 46, 0.95); backdrop-filter: blur(16px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 14px 0; z-index: 90; }
        .nav-item { color: var(--text-sub); text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #60a5fa; font-weight: bold; }
    </style>
</head>
<body>

    <div class="banner-wrapper">
        <div class="banner">
            <h3>متجر idk Plus</h3>
            <p>سورس شامل للتطبيقات والألعاب المعدلة</p>
        </div>
    </div>

    <div class="search-area">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن التطبيقات، الألعاب، الملاحظات..." oninput="searchApps()">
    </div>

    <div class="categories">
        <div class="chip active" onclick="switchCategory('all', this)">الكل</div>
        <div class="chip" onclick="switchCategory('plus', this)">تطبيقات بلس</div>
        <div class="chip" onclick="switchCategory('games', this)">الألعاب</div>
        <div class="chip" onclick="switchCategory('tools', this)">الأدوات والجيلبريك</div>
    </div>

    <div class="section-title" id="sectionTitle">التطبيقات المتاحة</div>

    <div id="appsContainer" class="apps-list">
        <div style="text-align:center; color:var(--text-sub); padding:30px;">جاري تحميل السورس وقراءة الملاحظات...</div>
    </div>

    <div id="appModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" id="navHome" onclick="switchCategory('all', null, 'navHome')">
            <span style="font-size:18px;">📱</span> الرئيسية
        </div>
        <div class="nav-item" id="navGames" onclick="switchCategory('games', null, 'navGames')">
            <span style="font-size:18px;">🎮</span> الألعاب
        </div>
        <div class="nav-item" id="navTools" onclick="switchCategory('tools', null, 'navTools')">
            <span style="font-size:18px;">⚙️</span> الأدوات
        </div>
    </nav>

    <script>
        let rawData = [];
        let currentFilter = 'all';

        fetch('IPA-AR.json')
            .then(res => res.json())
            .then(data => {
                rawData = Array.isArray(data) ? data : (data.apps || data.items || []);
                renderStore(rawData);
            })
            .catch(() => {
                document.getElementById('appsContainer').innerHTML = '<div style="text-align:center; color:#ef4444;">حدث خطأ أثناء تحميل ملف JSON</div>';
            });

        function renderStore(list) {
            const container = document.getElementById('appsContainer');
            container.innerHTML = '';

            if (!list.length) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">لا توجد نتائج مطابقة</div>';
                return;
            }

            list.forEach((app, idx) => {
                const name = app.name || app.title || 'تطبيق';
                const icon = app.iconURL || app.icon || app.icon_url || '';
                const version = app.version || app.ver || '1.0';
                const url = app.downloadURL || app.get || app.url || app.link || '';
                
                // جلب الملاحظات والوصف من السورس
                const note = app.subtitle || app.caption || app.description || app.note || app.info || '';

                if (!url) return;

                const installLink = url.startsWith('itms-services') ? url : `itms-services://?action=download-manifest&url=${url}`;

                container.innerHTML += `
                    <div class="app-item">
                        <div class="app-main" onclick="openDetails('${name}')">
                            <img class="app-icon" src="${icon}" onerror="this.src='https://via.placeholder.com/52/1e293b/ffffff?text=App'">
                            <div style="overflow:hidden;">
                                <div class="app-title">${name}</div>
                                <div class="app-sub">إصدار ${version}</div>
                                ${note ? `<div class="app-note">💡 ${note}</div>` : ''}
                            </div>
                        </div>
                        <a class="btn-get" href="${installLink}">تثبيت</a>
                    </div>
                `;
            });
        }

        function openDetails(appName) {
            const app = rawData.find(a => (a.name || a.title) === appName);
            if (!app) return;

            const url = app.downloadURL || app.get || app.url || app.link || '';
            const installLink = url.startsWith('itms-services') ? url : `itms-services://?action=download-manifest&url=${url}`;
            const note = app.subtitle || app.caption || app.description || app.note || app.info || 'لا توجد ملاحظات إضافية لهذا التطبيق.';

            document.getElementById('modalBody').innerHTML = `
                <div style="display:flex; gap:15px; align-items:center; margin-bottom:15px;">
                    <img src="${app.iconURL || app.icon || ''}" style="width:65px; height:65px; border-radius:14px;" onerror="this.src='https://via.placeholder.com/65/1e293b/ffffff?text=App'">
                    <div>
                        <h3 style="margin:0; font-size:17px; color:#fff;">${app.name || app.title}</h3>
                        <span style="color:var(--text-sub); font-size:12px;">الإصدار: ${app.version || '1.0'}</span>
                    </div>
                </div>
                <div style="background:rgba(255,255,255,0.04); padding:12px; border-radius:10px; font-size:13px; color:#cbd5e1; line-height:1.6; margin-bottom:20px; border:1px solid var(--border);">
                    <strong style="color:#60a5fa; display:block; margin-bottom:4px;">تفاصيل وملاحظات:</strong>
                    ${note}
                </div>
                <a class="btn-get" style="display:block; text-align:center; padding:12px; font-size:14px;" href="${installLink}">تثبيت التطبيق الآن</a>
            `;
            document.getElementById('appModal').classList.add('active');
        }

        function closeModal(e) {
            document.getElementById('appModal').classList.remove('active');
        }

        function switchCategory(type, element, navId) {
            currentFilter = type;

            if (element) {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                element.classList.add('active');
            }

            if (navId) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                document.getElementById(navId).classList.add('active');
            }

            let filtered = rawData;
            const titleEl = document.getElementById('sectionTitle');

            if (type === 'games') {
                titleEl.innerText = 'قسم الألعاب';
                filtered = rawData.filter(a => {
                    const str = ((a.name || '') + (a.subtitle || '') + (a.category || '')).toLowerCase();
                    return str.includes('game') || str.includes('hack') || str.includes('clash') || str.includes('pubg') || str.includes('gta') || str.includes('لعبة');
                });
            } else if (type === 'plus') {
                titleEl.innerText = 'تطبيقات البلس والشبكات';
                filtered = rawData.filter(a => {
                    const str = ((a.name || '') + (a.subtitle || '')).toLowerCase();
                    return str.includes('plus') || str.includes('gold') || str.includes('dark') || str.includes('root') || str.includes('instagram') || str.includes('telegram');
                });
            } else if (type === 'tools') {
                titleEl.innerText = 'الأدوات والجيلبريك';
                filtered = rawData.filter(a => {
                    const str = ((a.name || '') + (a.subtitle || '')).toLowerCase();
                    return str.includes('jailbreak') || str.includes('tool') || str.includes('root') || str.includes('boost') || str.includes('booster');
                });
            } else {
                titleEl.innerText = 'التطبيقات المتاحة';
            }

            renderStore(filtered);
        }

        function searchApps() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = rawData.filter(a => {
                const name = (a.name || a.title || '').toLowerCase();
                const note = (a.subtitle || a.caption || a.description || a.note || '').toLowerCase();
                return name.includes(q) || note.includes(q);
            });
            renderStore(filtered);
        }
    </script>
</body>
</html>
